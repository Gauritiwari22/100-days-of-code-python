{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">All Posts</h2>

<div class="row">
{% for post in posts %}
    <div class="col-md-4 mb-4">
        <div class="card p-3">

            <h4>{{ post.title }}</h4>

            <p>
                {{ post.content[:100] }}...
            </p>

            <a href="/post/{{ post.id }}" class="btn btn-primary btn-sm">Read</a>
            <a href="/edit/{{ post.id }}" class="btn btn-warning btn-sm">Edit</a>
            <a href="/delete/{{ post.id }}" class="btn btn-danger btn-sm">Delete</a>

        </div>
    </div>
{% endfor %}
</div>

{% endblock %}
